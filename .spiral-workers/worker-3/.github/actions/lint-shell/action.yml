name: Lint shell scripts
description: |
  Run shellcheck and shfmt against all SPIRAL shell scripts.
  Centralising these steps means the script list is maintained in one place.

runs:
  using: composite
  steps:
    - name: Run ShellCheck
      shell: bash
      run: |
        shellcheck --severity=error --format=gcc \
          spiral.sh \
          setup.sh \
          spiral.config.sh \
          lib/circuit_breaker.sh \
          lib/memory-pressure-check.sh \
          lib/run_parallel_ralph.sh \
          lib/spiral_assert.sh \
          lib/spiral_doctor.sh \
          lib/validate_preflight.sh \
          lib/worker_heartbeat.sh

    - name: Install shfmt
      shell: bash
      run: go install mvdan.cc/sh/v3/cmd/shfmt@latest

    - name: Check shell script formatting
      shell: bash
      run: |
        export PATH="$PATH:$(go env GOPATH)/bin"
        shfmt -d -i 2 -ci \
          spiral.sh \
          setup.sh \
          spiral.config.sh \
          ralph/ralph.sh \
          lib/circuit_breaker.sh \
          lib/memory-pressure-check.sh \
          lib/memory-watchdog.sh \
          lib/run_parallel_ralph.sh \
          lib/spiral_assert.sh \
          lib/spiral_doctor.sh \
          lib/spiral_retry.sh \
          lib/validate_preflight.sh \
          lib/worker_heartbeat.sh
