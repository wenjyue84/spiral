[project]
name = "spiral-tests"
version = "0.1.0"
description = "Test suite for SPIRAL"
requires-python = ">=3.13"
dependencies = [
    "spiral",
    "coverage[toml]>=7.13.4",
    "diff-cover>=9.1.0",
    "hypothesis>=6.151.9",
    "mutmut>=3.2.0",
    "mypy==1.11.2",
    "pre-commit>=4.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-benchmark>=5.0.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.11.0",
    "syrupy>=4.0.0",
    "uv-secure>=0.2.0",
]

[tool.uv.sources]
spiral = { workspace = true }

[tool.pytest.ini_options]
timeout = 60
timeout_method = "thread"
addopts = "-n 4 --dist loadscope -m 'not benchmark'"
markers = [
    "benchmark: marks tests as benchmark suite (deselect with '-m \"not benchmark\"')",
    "us_352: regression tests for cross-iteration story velocity model from results.tsv (US-352)",
    "us_461: regression tests for worker crash recovery using git worktree state snapshots (US-461)",
    "us_390: performance tests for Phase S Message Batches API (US-390)",
    "us_512: regression tests for Phase V pytest output parsing with subprocess mock (US-512)",
    "us_518: regression tests for episodic memory store write, retrieve, and context injection (US-518)",
    "us_531: performance tests for worker stall detection & restart heartbeat mechanism (US-531)",
    "us_617: regression tests for Phase M federated order topological sort (US-617)",
    "us_774: regression tests for Phase T flaky test detection and exclusion from story generation (US-774)",
    "us_1062: regression tests for Phase S validation confidence scorer (US-1062)",
    "us_1027: performance tests for Phase R research cache latency savings (US-1027)",
    "us_1008: performance tests for Phase C: phase timing baseline and regression detector (US-1195)",
    "us_491: E2E integration tests for Phase R research with mocked Gemini responses (US-1203)",
    "us_497: E2E tests for WebSocket /ws/cost real-time cost delta streaming (US-1204)",
    "us_697: Regression tests for Phase G federated CHANGELOG generation with cross-project dependencies (US-697)",
    "us_791: regression tests for Phase A constitution-aware story quality scoring (US-791)",
    "us_782: regression tests for Phase V blame attribution - correlate failing tests to story (US-782)",
    "us_524: performance tests for Phase S story validation batch vs sequential throughput (US-1236)",
    "us_1088: regression tests for Phase I transaction journal for crash-safe prd.json writes (US-1088)",
    "us_1100: performance tests for worker pool pre-warming startup optimization (US-1100)",
    "us_1102: regression tests for incremental Phase V test execution using --lf and changed-file detection (US-1102)",
]

[tool.coverage.run]
source = ["spiral"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 38
