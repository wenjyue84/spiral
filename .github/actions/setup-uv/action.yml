name: Set up uv with dependency cache
description: |
  Install uv, configure Python, and restore the uv dependency cache.
  Third-party action SHA pins are centralised here so updates apply in one place.

inputs:
  python-version:
    description: Python version to install (e.g. "3.13").
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
      with:
        enable-cache: false
        python-version: ${{ inputs.python-version }}

    - name: Get uv cache directory
      id: uv-cache-dir
      shell: bash
      run: echo "path=$(uv cache dir)" >> "$GITHUB_OUTPUT"

    - name: Cache uv dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ${{ steps.uv-cache-dir.outputs.path }}
          .venv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-
