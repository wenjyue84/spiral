name: Release

# Triggered when a semver tag is pushed (e.g., v1.0.0)
# Generates CHANGELOG.md and validates it is up-to-date for the release.

on:
  push:
    tags:
      - 'v[0-9]*'

# Deny all permissions by default; each job grants only what it needs.
permissions: read-all

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit updated CHANGELOG.md back to the tag

    steps:
      - name: Harden runner
        # TODO: Promote egress-policy to block after 2-week audit baseline (see US-399)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594  # v2.16.0
        with:
          egress-policy: audit
          # allowed-endpoints: api.anthropic.com:443 pypi.org:443 files.pythonhosted.org:443 api.github.com:443 registry.npmjs.org:443

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # full history required for git-cliff to see all commits

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate CHANGELOG.md for this release
        run: git-cliff --config cliff.toml --output CHANGELOG.md

      - name: Validate no unreleased commits remain unlogged
        # git-cliff --unreleased exits non-zero if there are commits beyond the
        # latest tag that are not yet captured in a release section.
        # On a tag push the current tag IS the release, so this should be empty.
        run: |
          UNRELEASED=$(git-cliff --config cliff.toml --unreleased 2>/dev/null || true)
          if [[ -n "$UNRELEASED" ]]; then
            echo "::warning::git-cliff --unreleased found commits not yet in a release section:"
            echo "$UNRELEASED"
          fi

      - name: Commit updated CHANGELOG.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md already up-to-date; nothing to commit"
          else
            git commit -m "chore(release): update CHANGELOG.md for ${GITHUB_REF_NAME}"
            git push origin HEAD:refs/heads/main
          fi

  api-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to upload API docs as release asset

    steps:
      - name: Harden runner
        # TODO: Promote egress-policy to block after 2-week audit baseline (see US-399)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594  # v2.16.0
        with:
          egress-policy: audit
          # allowed-endpoints: api.anthropic.com:443 pypi.org:443 files.pythonhosted.org:443 api.github.com:443 registry.npmjs.org:443

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up uv with cache
        uses: ./.github/actions/setup-uv

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Generate API documentation with pdoc
        run: |
          uv run pdoc lib \
            --docformat google \
            --output-directory docs/api \
            --title "SPIRAL API Documentation"

      - name: Upload API docs as release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a tarball of the API docs for distribution
          cd docs
          tar --gzip --create --file api-docs.tar.gz api/
          gh release upload "${{ github.ref_name }}" api-docs.tar.gz \
            --clobber

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to upload release assets
      id-token: write  # needed for SLSA provenance attestation
      attestations: write  # needed to create and upload attestations

    steps:
      - name: Harden runner
        # TODO: Promote egress-policy to block after 2-week audit baseline (see US-399)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594  # v2.16.0
        with:
          egress-policy: audit
          # allowed-endpoints: api.anthropic.com:443 pypi.org:443 files.pythonhosted.org:443 api.github.com:443 registry.npmjs.org:443

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up uv with cache
        uses: ./.github/actions/setup-uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate CycloneDX SBOM
        run: |
          uvx --from cyclonedx-bom cyclonedx-py environment \
            --of JSON \
            --outfile sbom.json

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" sbom.json \
            --clobber

      - name: Attest SBOM provenance (SLSA v1.0 Build Level 2)
        uses: actions/attest-build-provenance@5e9cb68e95676991667494285c405ad3af61edf9  # v2
        with:
          subject-path: sbom.json
