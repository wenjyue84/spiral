name: SPIRAL

# SECURITY: pull_request_target with untrusted code checkout is FORBIDDEN.
# Never use pull_request_target alongside a checkout of the PR branch, as it
# grants write permissions to untrusted code. See:
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

on:
  workflow_dispatch:
    inputs:
      max_iterations:
        description: "Maximum number of SPIRAL iterations to run"
        type: string
        default: "5"
      gate:
        description: "Auto-answer gate prompts"
        type: choice
        options:
          - proceed
          - skip
          - quit
        default: proceed
      dry_run:
        description: "Dry run: test control flow without making API calls"
        type: boolean
        default: false

# Deny all permissions by default; each job grants only what it needs.
permissions: read-all

jobs:
  spiral:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden runner
        # TODO: Promote egress-policy to block after 2-week audit baseline (see US-399)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594  # v2.16.0
        with:
          egress-policy: audit
          # allowed-endpoints: api.anthropic.com:443 pypi.org:443 files.pythonhosted.org:443 api.github.com:443 registry.npmjs.org:443

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up uv with cache
        uses: ./.github/actions/setup-uv

      - name: Install dependencies
        run: uv sync

      - name: Run SPIRAL
        run: |
          GATE="${{ inputs.gate }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            GATE="skip"
            bash spiral.sh "${{ inputs.max_iterations }}" --gate "$GATE" --dry-run
          else
            bash spiral.sh "${{ inputs.max_iterations }}" --gate "$GATE"
          fi

      - name: Upload SPIRAL artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: spiral-outputs-${{ github.run_id }}
          retention-days: 7
          path: |
            prd.json
            .spiral/_research_output.json
            results.tsv
            .spiral/spiral_events.jsonl
