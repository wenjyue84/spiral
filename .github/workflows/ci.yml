  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden runner
        # TODO: Promote egress-policy to block after 2-week audit baseline (see US-399)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc  # v2.15.1
        with:
          egress-policy: audit
          # allowed-endpoints: api.anthropic.com:443 pypi.org:443 files.pythonhosted.org:443 api.github.com:443 registry.npmjs.org:443

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up uv with cache
        uses: ./.github/actions/setup-uv

      - name: Validate lockfile is up-to-date
        # Developers must run 'uv lock' and commit uv.lock after changing pyproject.toml.
        # This check fails (without modifying files) if the lockfile would change,
        # surfacing drift as a CI failure rather than a mysterious import error.
        run: uv lock --check || { echo "::error::uv.lock is out of date with pyproject.toml. Run 'uv lock' locally and commit the updated uv.lock."; exit 1; }

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate CycloneDX SBOM
        run: |
          uvx --from cyclonedx-bom cyclonedx-py environment \
            --of JSON \
            --outfile sbom.json

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan SBOM for vulnerabilities
        run: |
          grype sbom:./sbom.json --fail-on high --output table \
            || { echo "::error::grype found HIGH or CRITICAL vulnerabilities in SBOM — see sbom-cyclonedx artifact"; exit 1; }

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 30

  # ── US-420: PR comment with prd.json story status ──────────────────────────
  prd-status-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden runner
        # TODO: Promote egress-policy to block after 2-week audit baseline (see US-399)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc  # v2.15.1
        with:
          egress-policy: audit
          # allowed-endpoints: api.anthropic.com:443 pypi.org:443 files.pythonhosted.org:443 api.github.com:443 registry.npmjs.org:443

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Check if prd.json changed
        id: prd-changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^prd\.json$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup uv
        if: steps.prd-changed.outputs.changed == 'true'
        uses: ./.github/actions/setup-uv

      - name: Sync dependencies
        if: steps.prd-changed.outputs.changed == 'true'
        run: uv sync --frozen

      - name: Generate status markdown
        if: steps.prd-changed.outputs.changed == 'true'
        id: status
        run: |
          {
            echo 'body<<SPIRAL_EOF'
            echo '<!-- spiral-prd-status -->'
            uv run python main.py status --format markdown
            echo 'SPIRAL_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: steps.prd-changed.outputs.changed == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const marker = '<!-- spiral-prd-status -->';
            const body = `${{ steps.status.outputs.body }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
