[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiral"
version = "0.1.0"
description = "SPIRAL library modules"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema-rs>=0.45.0",
    "jsonschema>=4.18.0",
    "questionary>=2.0.1",
    "sentence-transformers>=3.0.1",
    "scikit-learn>=1.5.1",
    "rapidfuzz>=3.14.3",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "pydantic>=2.0",
    "textual>=0.85.0",
    "aiofiles>=24.1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "websockets>=14.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
llm-guard = ["llm-guard>=0.3.0"]

[tool.hatch.build.targets.wheel]
only-packages = true
packages = []
