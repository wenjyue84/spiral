[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.workspace]
members = ["lib", "tests"]

# Security floors for transitive deps pinned too tightly by the optional llm-guard extra
# (llm-guard 0.3.x caps cryptography / json-repair / transformers at versions with open
# HIGH advisories; see uv-secure CI job). Overrides lift those caps; llm-guard is an
# optional extra and its scanner is exercised via mocks in tests/test_llm_guard_scanner.py.
[tool.uv]
override-dependencies = [
    "cryptography>=48.0.1",
    "json-repair>=0.60.1",
    "transformers>=5.10.0",
    "regex>=2025.10.22",
]

# uv-secure vulnerability scan configuration.
# Severity threshold: only report HIGH and above (filter LOW/MEDIUM noise).
# GHSA-r6ph-v2qm-q3c2 (cryptography 44.0.3): acknowledged — patched at 46.0.5.
# Upgrading cryptography 44→46 forces bc-detect-secrets 1.5.43→1.5.15, which
# causes llm-guard 0.3.16→0.3.15, then regex 2024.11.6→2024.7.24. The older
# regex has no prebuilt wheels for CPython 3.13 on Windows and fails to build.
# Ignored pending llm-guard releasing a version compatible with cryptography 46.
[tool.uv-secure.vulnerability_criteria]
severity = "high"
# GHSA-8mgp-746c-j5xp (nltk 3.10.3, latest release): no patched version exists upstream.
# Affects nltk model-artifact save/load helpers (TransitionParser, AveragedPerceptron,
# PerceptronTagger) given caller-controlled paths. nltk is only a transitive dep of the
# optional llm-guard extra and SPIRAL never imports nltk or passes it external paths.
# Re-check when nltk > 3.10.3 is released.
ignore_vulnerabilities = ["GHSA-r6ph-v2qm-q3c2", "GHSA-8mgp-746c-j5xp"]
allow_unused_ignores = true

[tool.coverage.run]
source = ["lib"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 38

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["lib/semantic_chunker.py", "tests/bats-core/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# E501 ignores for HTML/template-heavy files that can't wrap at 120 chars.
# Uses globs to survive SPIRAL's file-reorganisation into subdirectories.
"lib/**/spiral_dashboard.py" = ["E501"]
"lib/**/spiral_report.py" = ["E501"]
"lib/**/story_review_report.py" = ["E501"]
"lib/**/injection_detector.py" = ["E501"]
"lib/**/spiral_live_server.py" = ["E501"]
"lib/**/batch_validate.py" = ["E501"]
"lib/**/ai_suggest.py" = ["E501"]
"lib/**/invocation_snapshot.py" = ["E501"]
"tests/test_phase_r_integration.py" = ["E501"]
"tests/test_analytics_db.py" = ["E501"]
"tests/test_dashboard_profile.py" = ["E501"]
"tests/test_e2e_phase_burn_rate_us_1030.py" = ["E501"]
"tests/test_performance_us_390.py" = ["E501"]
"tests/test_phase_a_completed_dedup.py" = ["E501"]
"tests/test_phase_g_changelog_generation.py" = ["E501"]
"tests/test_research_cache_benchmark.py" = ["E501"]
"tests/test_security_ci_workflows.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spiral"]

[tool.pytest.ini_options]
timeout = 60
timeout_method = "thread"
addopts = "-n auto --dist loadscope"
pythonpath = [".", "lib"]
markers = [
    "benchmark: marks tests as benchmark suite (deselect with '-m \"not benchmark\"')",
]

[tool.mutmut]
paths_to_mutate = ["lib/"]
tests_dir = ["tests/"]
runner = "uv run pytest -x -q"

[tool.diff_cover]
compare_branch = "origin/main"
fail_under = 80

[dependency-groups]
dev = [
    "vulture>=2.15",
    "pytest-benchmark>=5.0.0",
    "import-linter>=2.1",
    "py-spy>=0.3",
    "pdoc>=14.0",
    "playwright>=1.40.0",
    "types-PyYAML>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
    "beautifulsoup4>=4.15.0",
    "graphviz>=0.21",
    "pytest-rerunfailures>=16.7",
]

[tool.importlinter]
root_packages = ["lib"]

# ── Mypy per-module overrides (gradual strict adoption) ──────────────────────

# transformers/sentence-transformers triggers a mypy INTERNAL ERROR (known upstream
# bug). Skip following imports into these packages entirely.
[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "sentence_transformers", "sentence_transformers.*"]
follow_imports = "skip"
ignore_errors = true

# New subdirectory modules auto-generated by SPIRAL. Type annotations are
# progressively tightened here; suppress strict errors in the interim.
[[tool.mypy.overrides]]
module = [
    "prd.*", "lib.prd.*",
    "workers.*", "lib.workers.*",
    "observability.*", "lib.observability.*",
    "quality.*", "lib.quality.*",
    "research.*", "lib.research.*",
    "resilience.*", "lib.resilience.*",
    "context.*", "lib.context.*",
    "lib.story_rewriter",
]
warn_return_any = false
disallow_any_generics = false
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────

[[tool.importlinter.contracts]]
name = "constants is a leaf module (no intra-lib imports)"
type = "layers"
layers = [
    "lib.story_helpers",
    "lib.constants",
]

[[tool.importlinter.contracts]]
name = "llm_router does not import from story pipeline modules"
type = "forbidden"
source_modules = ["lib.llm_router"]
forbidden_modules = ["lib.validate_stories", "lib.merge_stories", "lib.route_stories"]

[[tool.importlinter.contracts]]
name = "import adapters are independent of each other"
type = "independence"
modules = [
    "lib.import_csv",
    "lib.import_github",
    "lib.import_jira",
]

# Platform-split lock helpers: fcntl is POSIX-only and msvcrt.locking is Windows-only,
# so mypy reports attr-defined (and unused type: ignore) on whichever platform it runs.
[[tool.mypy.overrides]]
module = ["core.locked_append_tsv", "lib.core.locked_append_tsv", "core.spiral_io", "lib.core.spiral_io"]
disable_error_code = ["attr-defined"]
warn_unused_ignores = false
