[project]
name = "spiral"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema-rs>=0.45.0",
    "jsonschema>=4.18.0",
    "questionary>=2.0.1",
    "sentence-transformers>=3.0.1",
    "scikit-learn>=1.5.1",
    "rapidfuzz>=3.14.3",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "pydantic>=2.0",
    "textual>=0.85.0",
    "aiofiles>=24.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm-guard = ["llm-guard>=0.3.0"]

[project.scripts]
spiral = "main:main"

[tool.setuptools]
py-modules = ["main"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.13.4",
    "hypothesis>=6.151.9",
    "mutmut>=3.2.0",
    "mypy==1.11.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.11.0",
    "uv-secure>=0.2.0",
]

[tool.coverage.run]
source = ["lib"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 38

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

# Gradual adoption: existing lib files are opted in incrementally.
# Files listed here relax strict flags until they are fully annotated.
# To graduate a module: remove it from this list and fix the remaining errors.
[[tool.mypy.overrides]]
module = [
    "check_dag",
    "dependency_graph",
    "llm_models",
    "cost_check",
    "decompose_story",
    "evals_runner",
    "merge_results_tsv",
    "merge_stories",
    "merge_worker_results",
    "migrate_prd",
    "partition_prd",
    "populate_hints",
    "prd_lock",
    "prd_schema",
    "recommend_workers",
    "research_cache",
    "route_stories",
    "setup",
    "slice_prd",
    "spiral_dashboard",
    "spiral_report",
    "state_machine",
    "story_review_report",
    "llm_guard_scanner",
    "token_guard",
]
disallow_any_generics = false
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["lib/semantic_chunker.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"lib/spiral_dashboard.py" = ["E501"]
"lib/spiral_report.py" = ["E501"]
"lib/story_review_report.py" = ["E501"]
"lib/injection_detector.py" = ["E501"]
"lib/spiral_live_server.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lib"]

[tool.pytest.ini_options]
timeout = 60
timeout_method = "thread"
addopts = "-n auto --dist loadscope"

[tool.mutmut]
paths_to_mutate = ["lib/"]
tests_dir = ["tests/"]
runner = "uv run pytest -x -q"
# mutation_score_threshold = 60 (enforced in CI: .github/workflows/ci.yml mutation-test job)
