[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.workspace]
members = ["lib", "tests"]

[tool.coverage.run]
source = ["spiral"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 38

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["lib/semantic_chunker.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"lib/spiral_dashboard.py" = ["E501"]
"lib/spiral_report.py" = ["E501"]
"lib/story_review_report.py" = ["E501"]
"lib/injection_detector.py" = ["E501"]
"lib/spiral_live_server.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spiral"]

[tool.pytest.ini_options]
timeout = 60
timeout_method = "thread"
addopts = "-n auto --dist loadscope"
markers = [
    "benchmark: marks tests as benchmark suite (deselect with '-m \"not benchmark\"')",
]

[tool.mutmut]
paths_to_mutate = ["lib/"]
tests_dir = ["tests/"]
runner = "uv run pytest -x -q"

[tool.diff_cover]
compare_branch = "origin/main"
fail_under = 80

[dependency-groups]
dev = [
    "vulture>=2.15",
    "pytest-benchmark>=5.0.0",
]
