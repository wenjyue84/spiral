# Pre-commit hooks for local dev quality gate enforcement
# Run: uv run pre-commit install
# Hooks run on every commit, mirroring CI checks from spiral.sh

repos:
  # Ruff: lint and format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix]
      - id: ruff-format
        name: ruff format

  # MyPy: static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy type check
        language: system
        types: [python]
        args: [--strict, lib/, --ignore-missing-imports]
        pass_filenames: false
        exclude: lib/semantic_chunker.py

  # Shellcheck: shell script linting
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
        name: shellcheck
        args: [--severity=error]
      - id: shfmt
        name: shfmt format check
        args: [-i, '2', -ci]

  # Trailing whitespace and end-of-file fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
      - id: end-of-file-fixer
        name: fix end of file

# Files to exclude from all hooks
exclude: |
  (?x)^(
    \.spiral/|
    \.hypothesis/|
    \.git/|
    __pycache__|
    \.mypy_cache/|
    \.pytest_cache/|
    \.venv/|
    tests/bats-core/|
    lib/semantic_chunker\.py|
    _patch_parallel_rt\.py|
    scripts/decompose_stuck\.py
  )
