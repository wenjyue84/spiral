[plugin]
name = "notify-whatsapp"
version = "1.0.0"
description = "Sends story lifecycle notifications to WhatsApp via webhook"
hooks = ["post-story", "run-completion"]
allowed_env = ["WHATSAPP_WEBHOOK_URL"]
tags = ["notification", "whatsapp", "webhook"]
inputs = ["story_id", "story_title", "passes", "iteration"]
outputs = ["whatsapp_message_id"]

# Configuration:
#  - Set WHATSAPP_WEBHOOK_URL env var to your WhatsApp webhook endpoint
#    (e.g., local whatsapp-baileys service or configured webhook)
#  - Opt-in via SPIRAL_NOTIFY_WHATSAPP=true (disabled by default)
#  - Messages are plain-language format (no jargon, includes pass delta)
#
# Example webhook URL:
#  export WHATSAPP_WEBHOOK_URL="http://localhost:3000/webhook"
#  export SPIRAL_NOTIFY_WHATSAPP=true
